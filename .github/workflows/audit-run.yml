# Manually triggered end-to-end run of the deletion-audit agent.
#
# Secrets: ANTHROPIC_API_KEY comes only from the repository Actions secret of the same name and is
# mapped into the environment of the steps that call Claude. No step prints it, prints request
# headers, dumps the environment, or enables shell tracing (`set -x`).
#
# Audit cutoffs and export gates are enforced by the code itself; this workflow never relaxes them.
# Model-output cache entries (code/cache/{intent,vision}/*.json: model, purpose, prompt version, input
# digest, timestamp, usage, output) are uploaded for inspection and reproducibility, and kept in the
# Actions cache so later runs reuse them instead of paying again; they are never committed
# (code/cache/ is git-ignored) and are scanned for credential-like content before upload or caching.
# `code/main.py` exits 2 when the export gate refuses the final output.csv: that is reported as
# "export blocked", not as a failed run, and the provisional results are still uploaded.

name: Deletion audit run

on:
  workflow_dispatch:
    inputs:
      run_target:
        description: "Also audit the 518 target requests after the samples"
        type: boolean
        default: true
      dump_cache:
        description: "Print every model-output cache entry to the log (for environments that cannot download artifacts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deletion-audit-run
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r code/requirements.txt

      - name: Unit tests (offline, no credentials)
        run: python -m unittest discover -s code/tests -t code

      # Validated model outputs (keyed by model, prompt version and input digest) are reused across
      # runs so unchanged inputs are never paid for twice. Actions cache only; never committed.
      - name: Restore model-output cache
        uses: actions/cache/restore@v4
        with:
          path: code/cache
          key: model-cache-${{ github.run_id }}
          restore-keys: model-cache-

      - name: Check credential availability (boolean only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import os
          available = bool(os.environ.get("ANTHROPIC_API_KEY"))
          print("ANTHROPIC_API_KEY available to Python:", available)
          if not available:
              raise SystemExit("Repository Actions secret ANTHROPIC_API_KEY is missing or empty.")
          PY

      - name: Live smoke test (one intent classification, one screenshot extraction)
        id: smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ci-artifacts
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "code")
          from agent.intent import classify
          from agent.llm import Claude
          from agent.vision import extract
          from ingest.csv_inputs import load_requests
          from ingest.manifest import load_manifest
          from ingest.png_facts import parse_png_facts

          dataset = Path("dataset")
          claude = Claude()
          report = {}

          request = sorted(load_requests(dataset, "sample_deletion_requests.csv"), key=lambda r: r.case_id)[0]
          first = classify(claude, request.request_text)
          again = classify(claude, request.request_text)
          report["intent"] = {"case_id": request.case_id, "status": first.status, "source": first.source,
                              "reason": first.reason, "rerun_source": again.source}

          png = next(ef for ef in load_manifest(dataset) if ef.kind == "png")
          extraction, source = extract(claude, dataset / png.path)
          facts = parse_png_facts(png, extraction, source)
          report["vision"] = {"file_id": png.file_id, "source": source if extraction else None,
                              "error": None if extraction else source,
                              "records": len(extraction.get("records", [])) if extraction else 0,
                              "observations": len(facts.observations),
                              "rejected_values": sum(i.kind == "png_value_rejected" for i in facts.issues)}
          report["usage_totals"] = claude.ledger.totals()

          Path("ci-artifacts/smoke_report.json").write_text(json.dumps(report, indent=1) + "\n")
          print(json.dumps(report, indent=1))

          # Cache hits from earlier runs are valid: they were schema- and model-checked when stored.
          ok = (first.status in ("DELETION", "NON_DELETION") and again.source == "cache"
                and extraction is not None)
          if not ok:
              raise SystemExit("Live smoke test failed: see smoke_report.json (reasons are sanitized).")
          PY

      - name: Sample run and evaluation
        id: sample
        if: steps.smoke.outcome == 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python code/main.py --sample 2>&1 | tee ci-artifacts/sample_run.txt
          {
            echo "### Sample run"
            echo '```'
            cat ci-artifacts/sample_run.txt | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Target run (export gate decides whether output.csv is written)
        id: target
        if: steps.sample.outcome == 'success' && inputs.run_target
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python code/main.py 2>&1 | tee ci-artifacts/target_run.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "export=written" >> "$GITHUB_OUTPUT"
            echo "Final output.csv written and validated." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 2 ]; then
            echo "export=blocked" >> "$GITHUB_OUTPUT"
            echo "Final export blocked by the export gate; provisional results uploaded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "export=error" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          tail -n 8 ci-artifacts/target_run.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      # Explicit best-effort mode: every row must still pass schema, ordering, citation and cutoff
      # validation; unverified rows are classified in export_classes_target.json, not hidden.
      # --offline: reuses the outputs the target step validated and cached; no model calls.
      - name: Best-effort export (all rows, classified)
        id: best_effort
        if: steps.target.outcome == 'success'
        run: python code/main.py --offline --best-effort 2>&1 | tee ci-artifacts/best_effort_run.txt

      - name: Custom evaluation cases (cached model outputs only)
        if: steps.target.outcome == 'success'
        run: python code/evaluation/custom_cases.py 2>&1 | tee ci-artifacts/custom_cases.txt

      - name: Package code.zip (independent of the export result)
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ci-artifacts
          python code/package.py 2>&1 | tee ci-artifacts/package.txt

      - name: Verify selected artifacts contain no credentials
        id: scan
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Prints file names only, never matched content.
          shopt -s nullglob
          files=()
          for f in ci-artifacts/*.json ci-artifacts/*.txt code/eval/provisional_*.csv code/eval/unresolved_*.json \
                   code/eval/usage_*.json code/eval/export_classes_*.json code/cache/intent/*.json \
                   code/cache/vision/*.json output.csv; do
            [ -f "$f" ] && files+=("$f")
          done
          [ "${#files[@]}" -eq 0 ] && { echo "no artifact files to scan"; exit 0; }
          found=0
          if grep -lE 'sk-ant-[A-Za-z0-9_-]{8,}|x-api-key|[Aa]uthorization:' "${files[@]}"; then found=1; fi
          if [ -n "$ANTHROPIC_API_KEY" ] && grep -lF -- "$ANTHROPIC_API_KEY" "${files[@]}"; then found=1; fi
          if [ -f code.zip ]; then
            if unzip -p code.zip | grep -qE 'sk-ant-[A-Za-z0-9_-]{20,}'; then echo code.zip; found=1; fi
            if [ -n "$ANTHROPIC_API_KEY" ] && unzip -p code.zip | grep -qF -- "$ANTHROPIC_API_KEY"; then echo code.zip; found=1; fi
          fi
          if [ "$found" -ne 0 ]; then
            echo "Credential-like content found in the files listed above; upload skipped."
            exit 1
          fi
          echo "Scanned ${#files[@]} files: no credential-like content."

      - name: Print model-output cache entries to the log (opt-in)
        if: inputs.dump_cache && steps.scan.outcome == 'success'
        run: |
          # Model outputs and usage metadata only (credential-scanned above); one compact JSON line per
          # cache file, so environments that cannot download artifacts can rebuild and verify the cache.
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("code/cache").glob("*/*.json")):
              entry = json.loads(path.read_text())
              print("CACHE", f"{path.parent.name}/{path.name}", json.dumps(entry, sort_keys=True, ensure_ascii=False))
          PY

      - name: Save model-output cache
        if: always() && steps.scan.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: code/cache
          key: model-cache-${{ github.run_id }}

      - name: Upload run artifacts
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: deletion-audit-run-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ci-artifacts/smoke_report.json
            ci-artifacts/sample_run.txt
            ci-artifacts/target_run.txt
            ci-artifacts/custom_cases.txt
            ci-artifacts/best_effort_run.txt
            ci-artifacts/package.txt
            code/eval/provisional_sample.csv
            code/eval/provisional_target.csv
            code/eval/unresolved_sample.json
            code/eval/unresolved_target.json
            code/eval/usage_sample.json
            code/eval/usage_target.json
            code/eval/export_classes_target.json
            code/cache/intent/*.json
            code/cache/vision/*.json
            output.csv
            code.zip
